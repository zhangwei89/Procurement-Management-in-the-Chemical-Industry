<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="《化工行业采购管理》专著：供应资源配置、业务实务与数智化跃迁。涵盖传统采购、装置与工程采购、供应链安全合规、数字化与人工智能。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Vue -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
  
  <!-- Custom Styling for Chemical Industry Professional Theme -->
  <style>
    :root {
      --theme-color: #1a365d;
      --text-color: #2d3748;
      --heading-color: #1a365d;
      --sidebar-width: 320px;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      color: var(--text-color);
      line-height: 1.8;
    }

    /* Cover Page Customization */
    section.cover {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1a365d 100%) !important;
      color: #fff !important;
    }
    section.cover .cover-main {
      margin: 0 auto;
      max-width: 820px;
    }
    section.cover h1 {
      color: #f8fafc !important;
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    section.cover h1 small {
      font-size: 1.1rem;
      color: #38bdf8 !important;
      font-weight: 500;
    }
    section.cover blockquote {
      color: #94a3b8 !important;
      font-size: 1.2rem;
      border-left: 4px solid #38bdf8;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.8rem 1.2rem;
      margin: 1.5rem 0;
      border-radius: 4px;
    }
    section.cover p {
      font-size: 1.05rem;
      color: #cbd5e1;
    }
    section.cover ul {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
    }
    section.cover ul li {
      padding: 0.35rem 0;
      color: #e2e8f0;
    }
    section.cover a.anchor {
      display: none;
    }
    section.cover .btn-primary {
      background-color: #0284c7 !important;
      color: #ffffff !important;
      border: 1px solid #0284c7 !important;
      font-weight: 600;
      border-radius: 6px;
      padding: 0.65rem 1.6rem;
      margin: 0.5rem;
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }
    section.cover .btn-primary:hover {
      background-color: #0369a1 !important;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    section.cover .btn-secondary {
      background-color: transparent !important;
      color: #e2e8f0 !important;
      border: 1px solid #64748b !important;
      border-radius: 6px;
      padding: 0.65rem 1.4rem;
      margin: 0.5rem;
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }
    section.cover .btn-secondary:hover {
      color: #fff !important;
      border-color: #94a3b8 !important;
      background: rgba(255, 255, 255, 0.1) !important;
    }

    /* Sidebar Styling */
    .sidebar {
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 700;
      color: #0f172a;
      font-size: 0.95rem;
    }
    .sidebar-nav ul ul li a {
      font-size: 0.88rem;
      color: #475569;
    }
    .sidebar-nav li.active > a {
      color: var(--theme-color) !important;
      font-weight: bold;
      border-right: 3px solid var(--theme-color);
    }
    .app-name-link {
      font-weight: 800 !important;
      color: #1a365d !important;
      font-size: 1.15rem;
    }

    /* Content Typography & Tables */
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      color: var(--heading-color);
      font-weight: 700;
    }
    .markdown-section h1 {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-top: 2rem;
    }
    .markdown-section h2 {
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.4rem;
      margin-top: 1.8rem;
    }
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }
    .markdown-section table th {
      background-color: #f1f5f9;
      color: #1e293b;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
    }
    .markdown-section table td {
      border: 1px solid #e2e8f0;
      padding: 8px 12px;
    }
    .markdown-section table tr:nth-child(2n) {
      background-color: #f8fafc;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background-color: #f8fafc;
      padding: 0.8rem 1.2rem;
      margin: 1.2rem 0;
      color: #475569;
      border-radius: 0 4px 4px 0;
    }
    .markdown-section code {
      font-family: "Consolas", "Courier New", monospace;
      color: #0f766e;
      background-color: #f1f5f9;
      border-radius: 3px;
      padding: 2px 5px;
    }
    .markdown-section pre > code {
      color: #334155;
      background-color: #f8fafc;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    /* Math Formulas Display Optimization */
    mjx-container {
      display: inline-grid;
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
      vertical-align: middle;
    }
    mjx-container[jax="CHTML"][display="true"] {
      display: block;
      text-align: center;
      margin: 1.4rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.6rem 0;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #edf2f7;
    }
    .katex-display {
      margin: 1.4rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.6rem 0;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #edf2f7;
    }
  </style>
</head>
